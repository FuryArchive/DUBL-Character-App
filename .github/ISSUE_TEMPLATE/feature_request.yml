name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior without prescribing implementation unless necessary.
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      multiple: true
      options:
        - Shared application / rules
        - Android
        - Desktop
        - Rulebook importer
        - Persistence
        - Packaging / release
        - Documentation
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Rulebook/source reference
      description: If this changes DUBL behavior or content, cite the relevant rulebook/module section or explain that this is app-only UX.

  - type: textarea
    id: notes
    attributes:
      label: Additional context
